name: Build PIP-CO Registry

on:
  push:
    branches:
      - pip-co-idle-frameworks-v1.1.0

permissions:
  contents: write

jobs:
  build-registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: pip-co-idle-frameworks-v1.1.0
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run format
      - name: Commit generated registry and remove helper
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add holotapes/registry.json
          git rm .github/workflows/pipco-registry-temp.yml
          git commit -m "Build registry for PIP-CO Idle Frameworks v1.1.0"
          git push origin HEAD:pip-co-idle-frameworks-v1.1.0
