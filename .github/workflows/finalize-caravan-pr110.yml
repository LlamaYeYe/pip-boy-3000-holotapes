name: Finalize exact Caravan PR 110 package

on:
  push:
    branches:
      - caravan-v1.0.0
    paths:
      - ".github/workflows/finalize-caravan-pr110.yml"

permissions:
  contents: write

jobs:
  finalize-caravan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v5
        with:
          ref: caravan-v1.0.0
          fetch-depth: 0

      - name: Restore exact uploaded Caravan package bytes
        shell: bash
        run: |
          set -euo pipefail

          git clone --quiet https://github.com/LlamaYeYe/CARAVAN.git /tmp/caravan-source
          git -C /tmp/caravan-source checkout --quiet af9adf764f1a5b0481df2ad5670e469e939e516b

          test "$(find /tmp/caravan-source -type f -not -path '*/.git/*' | wc -l)" -eq 39
          test ! -e /tmp/caravan-source/LOGGING_SYSTEM_DEV_ONLY

          rm -rf holotapes/Caravan
          mkdir -p holotapes/Caravan
          rsync -a --exclude='.git' /tmp/caravan-source/ holotapes/Caravan/

          test "$(find holotapes/Caravan -type f | wc -l)" -eq 39
          test -f holotapes/Caravan/APP.JS
          test -f holotapes/Caravan/APP.MIN.JS
          test -f holotapes/Caravan/APPINFO/CARAVAN.info
          test ! -e holotapes/Caravan/app.js
          test ! -e holotapes/Caravan/app.min.js
          test ! -e holotapes/Caravan/LOGGING_SYSTEM_DEV_ONLY
          ! grep -R -n -E 'CARAVAN\.LOG|Pip\.log' holotapes/Caravan --include='*.JS' --include='*.js'

          test "$(git hash-object holotapes/Caravan/APP.JS)" = "e3dad580d056023292f365f82318c56a34baaf40"
          test "$(git hash-object holotapes/Caravan/APP.MIN.JS)" = "47b57cec14a89a2e62facf618098eee61ee52849"
          test "$(git hash-object holotapes/Caravan/APPINFO/CARAVAN.info)" = "e629aedc6e232f3da176844d378a67f8bd03dedb"
          test "$(git hash-object holotapes/Caravan/CARAVAN_GAME.JS)" = "e4f85e631c672c15ab41950d966c42baa7ffc93f"
          test "$(git hash-object holotapes/Caravan/assets/CARAVAN_GAME.MIN.JS)" = "0c0498b09b62578d67393daa8697c910f57b0724"
          test "$(git hash-object holotapes/Caravan/README.md)" = "f1b56c27e8109f9b5bc5547797447d906ec443c6"
          test "$(git hash-object holotapes/Caravan/metadata.json)" = "992b9d02dea1fe38df0e48f7750d79e9eebc8458"
          grep -q '"url": "Caravan/APP.MIN.JS"' holotapes/registry.json
          grep -q '"url": "Caravan/APPINFO/CARAVAN.info"' holotapes/registry.json

          rm -f .github/workflows/finalize-caravan-pr110.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit --no-verify -m "Finalize Caravan v1.0.0 package"
          git push origin HEAD:caravan-v1.0.0
