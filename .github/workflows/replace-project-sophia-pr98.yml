name: Replace PR 98 Project S.O.P.H.I.A.

on:
  push:
    branches:
      - project-sophia-v1.0.0
    paths:
      - .github/workflows/replace-project-sophia-pr98.yml

permissions:
  contents: write

jobs:
  replace-project-sophia:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: project-sophia-v1.0.0
          fetch-depth: 0

      - name: Fetch current Project S.O.P.H.I.A. v1.0.0
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/Project-S.O.P.H.I.A.
          git clone --depth 1 --branch main https://github.com/LlamaYeYe/Project-S.O.P.H.I.A.git /tmp/Project-S.O.P.H.I.A

      - name: Replace holotape package and registry entry
        shell: bash
        run: |
          set -euo pipefail

          rm -rf holotapes/ProjectSophia
          mkdir -p holotapes/ProjectSophia

          find /tmp/Project-S.O.P.H.I.A -mindepth 1 -maxdepth 1 ! -name .git -exec cp -a {} holotapes/ProjectSophia/ \;

          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path("holotapes")
          metadata_path = root / "ProjectSophia" / "metadata.json"
          registry_path = root / "registry.json"

          metadata = json.loads(metadata_path.read_text(encoding="utf-8"))
          registry = json.loads(registry_path.read_text(encoding="utf-8"))

          entry = dict(metadata)
          entry["icon"] = "ProjectSophia/" + metadata["icon"]
          entry["readme"] = "ProjectSophia/" + metadata["readme"]

          for item in entry.get("storage", []):
              item["url"] = "ProjectSophia/" + item["url"]

          for item in entry.get("storageOptional", []):
              item["url"] = "ProjectSophia/" + item["url"]
              if "previewMp3" in item:
                  item["previewMp3"] = "ProjectSophia/" + item["previewMp3"]

          found = False
          for index, item in enumerate(registry):
              if item.get("id") == "sophia":
                  registry[index] = entry
                  found = True
                  break

          if not found:
              registry.append(entry)

          registry_path.write_text(
              json.dumps(registry, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          PY

          test "$(python3 -c 'import json; print(json.load(open("holotapes/ProjectSophia/metadata.json"))["version"])')" = "1.0.0"
          test -f holotapes/ProjectSophia/APP.JS
          test -f holotapes/ProjectSophia/SOPHIA_ROUTER.JS
          test -f holotapes/ProjectSophia/SOPHIA_VOICE_ENGINE.JS
          test -f holotapes/ProjectSophia/assets/APP.MIN.JS
          test -f holotapes/ProjectSophia/assets/SOPHIA_ROUTER.MIN.JS
          test -f holotapes/ProjectSophia/assets/SOPHIA_VOICE_ENGINE.MIN.JS

      - name: Remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/replace-project-sophia-pr98.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

      - name: Commit replacement to PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Replace Project S.O.P.H.I.A. PR package with current v1.0.0 [skip ci]"
          git push origin HEAD:project-sophia-v1.0.0
